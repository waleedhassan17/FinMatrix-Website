<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These are the HOMEPAGE's tags, and the defaults for the signed-in app.
      Every public page (/, /about, /contact, the policies) is prerendered at
      build time by scripts/prerender.mjs, which rewrites the title,
      description, canonical and og:url below for that page, from
      src/features/site/siteMeta.ts. Change the wording there, not only here;
      src/features/site/__tests__/publicSite.test.ts checks the two agree.

      The origin is the live Vercel address. If FinMatrix moves to its own
      domain, change SITE_URL in siteMeta.ts and every absolute URL in this file
      and in public/robots.txt together.
    -->
    <title>FinMatrix — ERP software for inventory, sales, accounting and deliveries</title>
    <meta
      name="description"
      content="FinMatrix is ERP software that brings inventory, sales, purchases, accounting, deliveries and business reporting into one integrated system. Web console and Android app."
    />
    <link rel="canonical" href="https://finmatrix-theta.vercel.app/" />
    <meta name="theme-color" content="#1f4e79" />

    <!-- Icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- NO <link rel="preload"> for the marketing font, deliberately. The only
         path available here is the node_modules one, and Vite rewrites and
         hashes that into /assets/ at build time — so a preload written here
         resolves in dev and 404s in production, costing a failed request and
         buying nothing. The @font-face reaches the browser with the stylesheet,
         which is render-blocking anyway, and it is font-display: swap, so the
         headline paints in the fallback rather than not at all. -->

    <!-- Open Graph and Twitter cards. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FinMatrix" />
    <meta
      property="og:title"
      content="FinMatrix — ERP software for inventory, sales, accounting and deliveries"
    />
    <meta
      property="og:description"
      content="FinMatrix is ERP software that brings inventory, sales, purchases, accounting, deliveries and business reporting into one integrated system. Web console and Android app."
    />
    <meta property="og:url" content="https://finmatrix-theta.vercel.app/" />
    <meta property="og:image" content="https://finmatrix-theta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="FinMatrix — your stock and your books, the same number."
    />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FinMatrix — ERP software for inventory, sales, accounting and deliveries"
    />
    <meta
      name="twitter:description"
      content="FinMatrix is ERP software that brings inventory, sales, purchases, accounting, deliveries and business reporting into one integrated system. Web console and Android app."
    />
    <meta name="twitter:image" content="https://finmatrix-theta.vercel.app/og-image.png" />

    <!--
      A signed-in visitor who opens the bare address is sent to the dashboard.
      The homepage's prerendered markup (marked data-prerendered="landing") is
      hidden for them, so the sales pitch does not flash before the redirect.
      The key matches ACCESS_TOKEN_KEY in src/utils/storage.ts. React replaces
      the markup on its first render, so nothing stays hidden.
    -->
    <script>
      try {
        if (window.localStorage.getItem('@finmatrix/accessToken')) {
          document.documentElement.classList.add('fm-has-session');
        }
      } catch (e) {}
    </script>
    <style>
      .fm-has-session [data-prerendered='landing'] { display: none; }
    </style>

    <!--
      Structured data. Deliberately minimal: name, what it is, where it is and
      how to reach a human. No aggregateRating and no offers — a rating needs
      reviews that exist, and Google penalises invented ones; the same rule the
      landing copy follows. No legal name or street address: FinMatrix has none
      to publish yet. The contact addresses match
      src/features/landing/constants.ts — if one changes there, change it here.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://finmatrix-theta.vercel.app/#organization",
            "name": "FinMatrix",
            "url": "https://finmatrix-theta.vercel.app/",
            "logo": "https://finmatrix-theta.vercel.app/apple-touch-icon.png",
            "description": "FinMatrix is ERP software for businesses: one integrated system for inventory, sales, purchases, accounting, deliveries and business reporting.",
            "address": { "@type": "PostalAddress", "addressCountry": "PK" },
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "customer service",
                "email": "waleedhassansfd@gmail.com",
                "availableLanguage": ["en"]
              },
              {
                "@type": "ContactPoint",
                "contactType": "customer service",
                "email": "zaidvirk49@gmail.com",
                "availableLanguage": ["en"]
              }
            ]
          },
          {
            "@type": "SoftwareApplication",
            "name": "FinMatrix",
            "url": "https://finmatrix-theta.vercel.app/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Enterprise Resource Planning",
            "operatingSystem": "Web, Android",
            "publisher": { "@id": "https://finmatrix-theta.vercel.app/#organization" },
            "description": "ERP software for inventory, sales, purchases, accounting, deliveries and business reporting."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
